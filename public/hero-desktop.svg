<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="Illustration of the Cura Health dashboard showing charts and upcoming appointments">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#dbe7ff"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
    <filter id="chipShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1000" height="760" fill="url(#bgGrad)"/>
  <circle cx="110" cy="130" r="90" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="900" cy="640" r="110" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="850" cy="100" r="52" fill="#93c5fd" opacity="0.35"/>

  <!-- Main dashboard window: x 140-860, y 170-590 -->
  <g filter="url(#winShadow)">
    <rect x="140" y="170" width="720" height="420" rx="20" fill="#ffffff"/>
  </g>
  <!-- header -->
  <path d="M140 190a20 20 0 0 1 20-20h680a20 20 0 0 1 20 20v24H140z" fill="#f1f5f9"/>
  <circle cx="166" cy="192" r="5" fill="#ef4444"/>
  <circle cx="184" cy="192" r="5" fill="#f59e0b"/>
  <circle cx="202" cy="192" r="5" fill="#22c55e"/>

  <!-- sidebar -->
  <rect x="140" y="214" width="86" height="376" fill="#eff6ff"/>
  <rect x="158" y="238" width="52" height="52" rx="14" fill="#2563eb"/>
  <path d="M184 250v18M175 259h18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <rect x="152" y="312" width="62" height="26" rx="7" fill="#dbeafe"/>
  <rect x="152" y="348" width="62" height="26" rx="7" fill="#e2e8f0"/>
  <rect x="152" y="384" width="62" height="26" rx="7" fill="#e2e8f0"/>

  <!-- Dashboard heading -->
  <text x="252" y="228" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Dashboard</text>

  <!-- Chart card: New Patients per Month (x 250-530, y 240-410) -->
  <g filter="url(#cardShadow)">
    <rect x="250" y="240" width="280" height="170" rx="12" fill="#ffffff" stroke="#eef2f7"/>
  </g>
  <text x="266" y="266" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">New Patients per Month</text>
  <g font-family="Inter, system-ui, sans-serif">
    <line x1="266" y1="392" x2="514" y2="392" stroke="#e6ecf5" stroke-width="2"/>
    <rect x="278" y="358" width="24" height="34" rx="4" fill="url(#barGrad)"/>
    <rect x="326" y="342" width="24" height="50" rx="4" fill="url(#barGrad)"/>
    <rect x="374" y="348" width="24" height="44" rx="4" fill="url(#barGrad)"/>
    <rect x="422" y="326" width="24" height="66" rx="4" fill="url(#barGrad)"/>
    <rect x="470" y="310" width="24" height="82" rx="4" fill="url(#barGrad)"/>
    <text x="290" y="406" text-anchor="middle" font-size="9" fill="#64748b">Apr</text>
    <text x="338" y="406" text-anchor="middle" font-size="9" fill="#64748b">May</text>
    <text x="386" y="406" text-anchor="middle" font-size="9" fill="#64748b">Jun</text>
    <text x="434" y="406" text-anchor="middle" font-size="9" fill="#64748b">Jul</text>
    <text x="482" y="406" text-anchor="middle" font-size="9" fill="#64748b">Aug</text>
  </g>

  <!-- Chart card: Appointment Status donut (x 550-830, y 240-410) -->
  <g filter="url(#cardShadow)">
    <rect x="550" y="240" width="280" height="170" rx="12" fill="#ffffff" stroke="#eef2f7"/>
  </g>
  <text x="566" y="266" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Appointment Status</text>
  <g transform="translate(640,340)" font-family="Inter, system-ui, sans-serif">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#0072B2" stroke-width="14" stroke-dasharray="132 264" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#009E73" stroke-width="14" stroke-dasharray="92 264" transform="rotate(90)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#D55E00" stroke-width="14" stroke-dasharray="40 264" transform="rotate(216)"/>
    <circle cx="0" cy="0" r="24" fill="#ffffff"/>
    <text x="0" y="4" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">24</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="10" fill="#334155">
    <circle cx="716" cy="318" r="4" fill="#0072B2"/><text x="726" y="322">Booked</text>
    <circle cx="716" cy="340" r="4" fill="#009E73"/><text x="726" y="344">Done</text>
    <circle cx="716" cy="362" r="4" fill="#D55E00"/><text x="726" y="366">No-show</text>
  </g>
  <!-- Upcoming Appointments section: x 250-830, y 430-565 -->
  <text x="252" y="450" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Upcoming Appointments</text>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- card 1 -->
    <g filter="url(#cardShadow)">
      <rect x="250" y="462" width="182" height="98" rx="12" fill="#ffffff" stroke="#eef2f7"/>
    </g>
    <circle cx="278" cy="492" r="14" fill="#dbeafe"/>
    <text x="278" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">JD</text>
    <text x="270" y="524" font-size="12" font-weight="600" fill="#0f172a">Jane Doe</text>
    <text x="270" y="540" font-size="10" fill="#64748b">Mon · 9:00 AM</text>
    <rect x="265" y="536" width="46" height="20" rx="5" fill="#dcfce7"/>
    <text x="288" y="550" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">Done</text>
    <rect x="315" y="536" width="52" height="20" rx="5" fill="#fef3c7"/>
    <text x="341" y="550" text-anchor="middle" font-size="9" font-weight="600" fill="#b45309">No-show</text>
    <rect x="371" y="536" width="46" height="20" rx="5" fill="#ffe4e6"/>
    <text x="394" y="550" text-anchor="middle" font-size="9" font-weight="600" fill="#be123c">Cancel</text>

    <!-- card 2 -->
    <g filter="url(#cardShadow)">
      <rect x="444" y="462" width="182" height="98" rx="12" fill="#ffffff" stroke="#eef2f7"/>
    </g>
    <circle cx="472" cy="492" r="14" fill="#dbeafe"/>
    <text x="472" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">MR</text>
    <text x="464" y="524" font-size="12" font-weight="600" fill="#0f172a">Mark Reyes</text>
    <text x="464" y="540" font-size="10" fill="#64748b">Mon · 10:30 AM</text>
    <rect x="459" y="536" width="46" height="20" rx="5" fill="#dcfce7"/>
    <text x="482" y="550" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">Done</text>
    <rect x="509" y="536" width="52" height="20" rx="5" fill="#fef3c7"/>
    <text x="535" y="550" text-anchor="middle" font-size="9" font-weight="600" fill="#b45309">No-show</text>
    <rect x="565" y="536" width="46" height="20" rx="5" fill="#ffe4e6"/>
    <text x="588" y="550" text-anchor="middle" font-size="9" font-weight="600" fill="#be123c">Cancel</text>

    <!-- card 3 -->
    <g filter="url(#cardShadow)">
      <rect x="638" y="462" width="182" height="98" rx="12" fill="#ffffff" stroke="#eef2f7"/>
    </g>
    <circle cx="666" cy="492" r="14" fill="#dbeafe"/>
    <text x="666" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">AP</text>
    <text x="658" y="524" font-size="12" font-weight="600" fill="#0f172a">Ava Patel</text>
    <text x="658" y="540" font-size="10" fill="#64748b">Mon · 1:00 PM</text>
    <rect x="653" y="536" width="46" height="20" rx="5" fill="#dcfce7"/>
    <text x="676" y="550" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">Done</text>
    <rect x="703" y="536" width="52" height="20" rx="5" fill="#fef3c7"/>
    <text x="729" y="550" text-anchor="middle" font-size="9" font-weight="600" fill="#b45309">No-show</text>
    <rect x="759" y="536" width="46" height="20" rx="5" fill="#ffe4e6"/>
    <text x="782" y="550" text-anchor="middle" font-size="9" font-weight="600" fill="#be123c">Cancel</text>
  </g>

  <!-- Floating: heart chip (left, overlaps window edge) -->
  <g transform="translate(56,300) rotate(-8)" filter="url(#chipShadow)">
    <rect width="72" height="72" rx="20" fill="#ffffff"/>
    <path d="M36 54s-14-9-14-19a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 10-14 19-14 19z" fill="#ef4444"/>
  </g>

  <!-- Floating: calendar chip (right, overlaps window edge) -->
  <g transform="translate(866,300) rotate(7)" filter="url(#chipShadow)">
    <rect width="72" height="72" rx="20" fill="#ffffff"/>
    <rect x="16" y="24" width="40" height="34" rx="6" fill="none" stroke="#2563eb" stroke-width="3"/>
    <line x1="16" y1="34" x2="56" y2="34" stroke="#2563eb" stroke-width="3"/>
    <line x1="26" y1="17" x2="26" y2="27" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="17" x2="46" y2="27" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="45" r="3" fill="#2563eb"/>
    <circle cx="42" cy="45" r="3" fill="#2563eb"/>
  </g>

  <!-- Wordmark -->
  <text x="500" y="690" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#2563eb">Cura Health</text>
</svg>

